<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZITLAS — Help &amp; Support</title>
  <link rel="stylesheet" href="help-support.css" />
  <link rel="stylesheet" href="../../../assets/css/theme.css" />
  <link rel="stylesheet" href="" />
  <script src="../../../assets/js/i18n.js"></script>
</head>
<body>

  <!-- APP BAR -->
  <header class="app-bar">
    <a href="../profile.html" class="back-btn" aria-label="Back to Profile">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <span class="page-title">Help &amp; Support</span>
    <div class="app-bar-spacer"></div>
  </header>

  <main class="main-content">

    <!-- PAGE HERO -->
    <section class="page-hero">
      <div class="hero-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <h1 class="hero-title">Help &amp; Support</h1>
      <p class="hero-subtitle">Need help? Send your query directly to Team ZITLAS.</p>
    </section>

    <!-- SUPPORT FORM -->
    <section class="form-section visible" id="formSection">
      <form class="support-form" id="supportForm" novalidate>

        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label" for="nameField">
            Full Name <span class="required">*</span>
          </label>
          <input
            type="text"
            id="nameField"
            class="form-input"
            placeholder="Enter your full name"
            autocomplete="name"
          />
          <span class="field-error" id="nameError"></span>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="emailField">
            Email <span class="required">*</span>
          </label>
          <input
            type="email"
            id="emailField"
            class="form-input"
            placeholder="your@email.com"
            autocomplete="email"
          />
          <span class="field-error" id="emailError"></span>
        </div>

        <!-- Subject -->
        <div class="form-group">
          <label class="form-label" for="subjectField">
            Subject <span class="required">*</span>
          </label>
          <input
            type="text"
            id="subjectField"
            class="form-input"
            placeholder="Brief subject of your query"
          />
          <span class="field-error" id="subjectError"></span>
        </div>

        <!-- Category -->
        <div class="form-group">
          <label class="form-label" for="categoryField">
            Category <span class="required">*</span>
          </label>
          <div class="select-wrapper">
            <select id="categoryField" class="form-select">
              <option value="">Select a category</option>
              <option value="Technical Issue">Technical Issue</option>
              <option value="Training Plan Issue">Training Plan Issue</option>
              <option value="Nutrition Plan Issue">Nutrition Plan Issue</option>
              <option value="Account Problem">Account Problem</option>
              <option value="Subscription">Subscription</option>
              <option value="Feature Request">Feature Request</option>
              <option value="Other">Other</option>
            </select>
            <svg class="select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
          <span class="field-error" id="categoryError"></span>
        </div>

        <!-- Message -->
        <div class="form-group">
          <label class="form-label" for="messageField">
            Message <span class="required">*</span>
          </label>
          <textarea
            id="messageField"
            class="form-textarea"
            placeholder="Describe your issue or query in detail..."
            rows="5"
          ></textarea>
          <div class="message-footer">
            <span class="char-counter" id="charCounterEl">
              <span id="charCount">0</span> characters (min. 20)
            </span>
            <span class="field-error inline" id="messageError"></span>
          </div>
        </div>

        <!-- Attach Screenshot -->
        <div class="form-group">
          <label class="form-label">
            Attach Screenshot
            <span class="optional-tag">optional</span>
          </label>
          <div class="file-upload-area" id="fileUploadArea">
            <input type="file" id="screenshotField" accept="image/*" class="visually-hidden" />
            <label for="screenshotField" class="file-upload-label">
              <span class="file-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
              </span>
              <span class="file-upload-text" id="fileUploadText">Click to attach a screenshot</span>
              <span class="file-upload-sub">PNG, JPG, WEBP — max 5 MB</span>
            </label>
          </div>
          <button type="button" class="file-remove-btn" id="fileRemoveBtn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
            Remove file
          </button>
        </div>

        <!-- Submit -->
        <button type="submit" class="send-btn" id="sendBtn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          <span id="sendBtnText">Send Message</span>
        </button>

      </form>
    </section>

  </main>

  <div class="toast" id="toast"></div>
  <script src="help-support.js"></script>
  <script src="../../../components/wallet.js"></script>
</body>
</html>
